name: Maqarr fixture CI
on:
  push:
    branches: [python, go, javascript, typescript, rust, ruby, elixir]
permissions:
  contents: read
concurrency:
  group: maqarr-fixture-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fixture-checks:
    name: Fixture checks
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify known source and deliberate CI result
        run: python3 -I .maqarr-ci/check.py
